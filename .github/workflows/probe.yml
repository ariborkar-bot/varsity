name: Probe page fields
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Team football url'
        default: 'https://www.maxpreps.com/ca/santa-ana/mater-dei-monarchs/football/'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - env:
          VARSITY_CONTACT: https://github.com/ariborkar-bot/varsity
        run: |
          python3 - <<'PY'
          import sys, json
          sys.path.insert(0, 'tools/sections')
          import maxpreps as M
          f = M.Fetcher(delay=1.0)
          for url in ['${{ inputs.url }}', 'https://www.maxpreps.com/ca/carlsbad/carlsbad-lancers/football/']:
              pp = M.next_data(f._open(url + 'schedule/'))['props']['pageProps']
              print('PAGEPROPS KEYS', list(pp.keys()))
              tc = (pp.get('teamContext') or {}).get('data') or {}
              print('TEAMCONTEXT', json.dumps(tc)[:3000])
              def walk(o, path, out):
                  if isinstance(o, dict):
                      for k, v in o.items():
                          if isinstance(v, str) and any(w in (k + v).lower() for w in ('mascot', 'logo', 'playoff', 'bracket', 'tournament')):
                              out.append((path + '.' + k, v[:160]))
                          walk(v, path + '.' + k, out)
                  elif isinstance(o, list):
                      for i, v in enumerate(o[:40]):
                          if isinstance(v, str) and any(w in v.lower() for w in ('mascot', 'logo', 'playoff', 'bracket', 'tournament')):
                              out.append((path + '[%d]' % i, v[:160]))
                          walk(v, path + '[%d]' % i, out)
              out = []; walk(pp, 'pp', out)
              seen = set()
              for p, v in out:
                  key = ''.join(c for c in p if not c.isdigit())
                  if key in seen: continue
                  seen.add(key); print('HIT', p, '=', v)
              cs = pp.get('contests') or []
              print('N CONTESTS', len(cs))
              for r in cs[-3:]:
                  print('ROW', json.dumps(r)[:2500])
          PY
