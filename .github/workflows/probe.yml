name: Probe page fields
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Team football url'
        default: 'https://www.maxpreps.com/ca/santa-ana/mater-dei-monarchs/football/'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - env:
          VARSITY_CONTACT: https://github.com/ariborkar-bot/varsity
        run: |
          python3 - <<'PY'
          import urllib.request
          base='https://image.maxpreps.io/school-mascot/2/b/6/2b6b45d3-4465-4750-ba48-a273b674e37c.gif'
          for q in ['?version=637964957400000000&width=1024&height=1024','?version=637964957400000000&width=96&height=96','?width=96&height=96','']:
              try:
                  r=urllib.request.urlopen(urllib.request.Request(base+q,headers={'User-Agent':'Mozilla/5.0'}),timeout=20)
                  b=r.read();print('IMG',q,r.status,r.headers.get('Content-Type'),len(b),r.headers.get('Access-Control-Allow-Origin'))
              except Exception as e: print('IMG',q,'ERR',e)
          PY
