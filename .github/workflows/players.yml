# Varsity player stats: read every played game's MaxPreps box score (games come from data/sections/*.json, so run "Collect section data" first),
# add the players up per section and sport, commit data/players/ and rebuild api/v1/. Resumable: games already counted are skipped, so a run
# cut short by max_minutes (or a failure) keeps its progress and the next run carries on. Football first; basketball has ~6x the games.
name: Collect section players
on:
  workflow_dispatch:
    inputs:
      sport:
        description: 'Sport'
        type: choice
        options: [fb, bb]
        default: fb
      max_minutes:
        description: 'Stop reading box scores after this many minutes (progress is saved)'
        default: '300'
      delay:
        description: 'Seconds between requests'
        default: '0.5'
      max_games:
        description: 'Most box scores this run (0 = no limit; use a small number for a test)'
        default: '0'
concurrency:
  group: varsity-collect
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  players:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline tests
        run: |
          python3 -I tools/sections/test_maxpreps.py
          python3 -I tools/sections/test_players.py
      - name: Read box scores in 20-minute rounds, committing after each round
        env:
          VARSITY_CONTACT: https://github.com/ariborkar-bot/varsity
        run: |
          git config user.name "varsity-collector"
          git config user.email "actions@users.noreply.github.com"
          START=$(date +%s)
          for round in $(seq 1 30); do
            python3 -I tools/sections/players.py --sport "${{ inputs.sport }}" --delay "${{ inputs.delay }}" --max-minutes 20 --max-games "${{ inputs.max_games }}" | tee round.log || true
            python3 -I tools/sections/build_api.py || true
            git add data/players api
            if ! git diff --cached --quiet; then
              git commit -q -m "Player stats update (${{ inputs.sport }}, round $round)"
              git pull --rebase -q && git push -q || echo "push failed, will retry next round"
            fi
            grep -q "0 to fetch" round.log && break
            grep -q "STOPPED" round.log && break
            [ "${{ inputs.max_games }}" != "0" ] && break
            [ $(( $(date +%s) - START )) -gt $(( ${{ inputs.max_minutes }} * 60 )) ] && break
          done
      - name: Commit anything left (also after a failure)
        if: always()
        run: |
          git config user.name "varsity-collector"
          git config user.email "actions@users.noreply.github.com"
          git add data/players api
          git diff --cached --quiet && echo "nothing left" && exit 0
          git commit -m "Player stats update (final)"
          git pull --rebase -q
          git push
