<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),lerp=(a,b,k)=>a+(b-a)*k;
const E={out:x=>1-Math.pow(1-x,3),in:x=>x*x*x,io:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,back:x=>{const c1=1.7,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)},expo:x=>x===1?1:1-Math.pow(2,-10*x)};

const PX=1080/392;   /* css px -> video px */
/* ---------------- chat ---------------- */
const MS=[ // [time, who('me' or initials), name, text or {link}]
 [-9,'AR','Ava','did anyone get the film from friday'],[-9,'MT','Malik','coach said 3:15 not 3'],[-9,'CP','Chris','who’s driving friday'],[-9,'me','','me'],[-9,'DM','Diego','shotgun'],
 [0.15,'MT','Malik','yo'],[0.42,'MT','Malik','look what i found'],[0.82,'MT','Malik',{link:1}],
 [1.42,'DM','Diego','wait it has OUR school??'],[1.92,'CP','Chris','bro i’m literally on here 😭'],[2.38,'me','','league tonight. loser buys chipotle'],[2.84,'DM','Diego','bet'],
 [BRK+0.12,'DM','Diego','who put 50 on mount miguel 💀'],[BRK+0.62,'me','','the upset is coming'],[BRK+1.12,'MT','Malik','draft at 7. code FNL-7Q2K'] ];

MS.forEach((m,i)=>{const [at,who,name,txt]=m;const prev=MS[i-1],next=MS[i+1];
  const first=!prev||prev[1]!==who,last=!next||next[1]!==who||next[0]-at>5;
  const w=document.createElement('div');w.className='wrap';
  if(i===5||i===12)w.innerHTML='<div class="tsp"></div>';
  if(who!=='me'&&first)w.innerHTML+=`<div class="who">${name}</div>`;
  const inner=typeof txt==='object'?`<div class="link"><div class="im"><img src="/home/claude/varsity/icons/icon-512-v2.png"><div>VARSITY</div></div><div class="tx"><b>Varsity</b><small>ariborkar-bot.github.io</small></div></div>`:`<div class="bub">${txt}</div>`;
  w.innerHTML+=`<div class="row ${who==='me'?'me':''}">${who!=='me'?(last?`<div class="av">${who}</div>`:'<div class="sp"></div>'):''}${inner}</div>`;
  w.dataset.at=at;box.appendChild(w)});
const wraps=[...box.children];
function chatAt(t){
  let newest=null;wraps.forEach(w=>{const on=t>=+w.dataset.at;w.style.display=on?'':'none';if(on)newest=w});
  /* the newest message pops in and pushes the rest up */
  const at=+newest.dataset.at,k=cl((t-at)/.22),h=newest.offsetHeight+6;
  box.style.transform=`translateY(${(1-E.out(k))*h}px)`;
  const b=newest.querySelector('.bub,.link');if(b){b.style.transform=`scale(${lerp(.6,1,E.back(k))})`;b.style.opacity=cl(k*3)}
  wraps.forEach(w=>{if(w!==newest){const b=w.querySelector('.bub,.link');if(b){b.style.transform='none';b.style.opacity=1}}});
}
/* ---------------- app clips ---------------- */
const CLIP=(n,i)=>`/home/claude/mk/clips/${n}/f${String(Math.max(0,i)).padStart(4,'0')}.jpg`;
async function setImg(img,src){if(img.dataset.src!==src){img.src=src;img.dataset.src=src;try{await img.decode()}catch(e){}}}
/* league clip: one frame per 7 css px of scroll */
const LG=[[DROP,0],[DROP+.42,402,'expo'],[5.05,402],[5.45,1120,'io'],[7.25,1120],[7.62,3952,'io'],[PK,3952]];
function keyed(K,t){for(let i=1;i<K.length;i++){if(t<=K[i][0]){const [a,va]=K[i-1],[b,vb,e]=K[i];return lerp(va,vb,seg(t,a,b,e||'io'))}}return K[K.length-1][1]}
/* camera keys: [t, scale, focusX, focusY] (focus = video px of the clip that sits at screen centre-ish) */
const camL=[[DROP,1,540,960],[4.1,1,540,960],[4.35,1.16,540,840,'expo'],[5.05,1.18,540,840],[5.35,1,540,960,'io'],[5.85,1,540,960],[6.05,1.18,540,640,'expo'],[7.2,1.2,540,640],[7.45,1,540,960,'io'],[7.95,1,540,960],[8.15,1.07,540,1150,'expo'],[PK,1.08,540,1150]];
const camK=[[PK,1,540,960],[9.0,1,540,960],[9.35,1.25,540,1000,'io'],[10.3,1.25,540,1000],[10.5,1.55,360,1080,'expo'],[11.9,1.58,360,1080],[12.3,1.15,540,1080,'io'],[PP,1.15,540,1080]];
const camP=[[PP,1,540,960],[14.0,1,540,960],[14.3,1.3,540,1080,'io'],[15.3,1.32,540,1080],[15.5,1.75,300,1150,'expo'],[16.7,1.8,300,1150],[BRK,1.2,540,1000,'io']];
function cam(K,t){let a=K[0],b=K[0];for(let i=1;i<K.length;i++){if(t<=K[i][0]){a=K[i-1];b=K[i];break}a=b=K[i]}
  const k=a===b?1:seg(t,a[0],b[0],b[4]||'io');return{s:lerp(a[1],b[1],k),fx:lerp(a[2],b[2],k),fy:lerp(a[3],b[3],k)}}
function apply(el,c,dx=0,dy=0,extra=1){const s=c.s*extra;let x=540-c.fx*s,y=960-c.fy*s;x=Math.min(0,Math.max(1080-1080*s,x));y=Math.min(0,Math.max(1920-1920*s,y));el.style.transform=`translate(${x+dx}px,${y+dy}px) scale(${s})`;return{x,y,s}}
/* beat punch: small zoom on every beat in the app sections, bigger on accents */
const ACC=[DROP,4.35,6.05,8.15,PK,10.5,PP,15.5];
function punch(t){let p=0;const bt=(t-DROP)/B;if(t>=DROP&&t<BRK){const f=bt-Math.floor(bt);p+=0.018*Math.exp(-f*B*14)}
  for(const a of ACC){const k=t-a;if(k>=0&&k<.35)p+=0.07*Math.exp(-k*14)}return 1+p}
function shake(t){let x=0,y=0;for(const a of ACC){const k=t-a;if(k>=0&&k<.3){const f=1-k/.3;x+=Math.sin(k*95)*16*f;y+=Math.cos(k*80)*12*f}}return{x,y}}
const TAPS={picks8:[[20,105.1,299.1],[46,259.3,395.5]],props8:[[20,109.5,380.4],[46,202.3,492.6]]};

function capSet(el,t,list,y){let cur=null;for(const c of list)if(t>=c[0]&&t<c[1])cur=c;
  if(!cur){el.style.display='none';return}el.style.display='';el.innerHTML='<span>'+cur[2]+'</span>';const k=cl((t-cur[0])/.12);
  el.style.top=(cur[3]||y)+'px';el.style.transform=`scale(${lerp(1.25,1,E.back(k))})`;el.style.opacity=cl(k*2)}
const CAPS=[[DROP+.05,5.3,'started a league w the boys',300],[5.45,7.4,'week 11 vs diego 😭',300],[7.65,PK,'diego in last place 💀',1560],
  [PK+.03,9.75,'then we found pick ’em 👀',300],[9.75,10.5,'50 tokens on the upset…',300],[10.5,12.3,'= 383 tokens 🤑',300],[12.3,PP,'mount miguel let’s go 🙏',300],
  [PP+.03,14.6,'player props too??',300],[14.6,15.5,'hezekiah over 323.5 yds',300],[15.5,BRK,'easy. locked 🔒',1530]];
const CAPS2=[[12.3,PP,'tokens are free · no real money',395],[DROP+.05,5.3,'',0]];
/* ---------------- render ---------------- */
const app=$('app'),aimg=$('aimg'),chat=$('chat'),rip=$('rip'),ring=$('ring');
async function render(t){
  const inChat=t<DROP||(t>=BRK);
  chat.style.display=inChat?'':'none';app.style.display=inChat?'none':'';
  $('hbv').setAttribute('stdDeviation','0 0');$('vbv').setAttribute('stdDeviation','0 0');app.style.filter='none';chat.style.filter='none';

  if(inChat){
    chatAt(t);let c={x:0,y:0,s:1};
    if(t<DROP){ /* tap the link, then zoom through it into the app */
      const lk=box.querySelector('.link');const r=lk.getBoundingClientRect();
      const cx=r.left+r.width/2,cy=r.top+r.height/2;
      if(t>=3.0&&t<3.25){rip.style.display='';const k=(t-3.0)/.25;st(rip,{left:cx+'px',top:cy+'px',transform:`scale(${lerp(.4,1.5,k)})`,opacity:1-k})}
      const z=seg(t,3.05,DROP,'in');const s=lerp(1,4.2,z);chat.style.transform=`translate(${cx-cx*s}px,${cy-cy*s}px) scale(${s})`;

    if(t>=PP&&t<PP+.18){const k=seg(t,PP,PP+.18,'out');extra*=lerp(.75,1,k);app.style.filter=`blur(${(1-k)*16}px)`}

    const g=apply(app,c,dx+sh.x,dy+sh.y,extra);

}
