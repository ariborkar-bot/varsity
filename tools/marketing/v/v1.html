</div><script src="lib.js"></script><script>

function headline(t,a,b,html,size=118,y=230){if(t<a||t>=b)return false;const u=seg(t,a,a+.22,'back');head.innerHTML=html;head.style.fontSize=size+'px';tf(head,{y:y+(1-u)*60,s:lerp(1.3,1,u),o:Math.min(u*3,1)*(1-seg(t,b-.12,b))});return true}

  const zs=s*(1+z*.55);const X=PX-(fx*zs-fx*s),Y=y-(fy*zs-fy*s);
  tf(ph,{x:X+sh.x,y:Y+sh.y,s:zs,r:sh.r,o,blur:bl});ph.style.display=t<13.4?'':'none';
  st(dim,{opacity:hk?1:0});
  if(t<7.0){const fi=t<2.6?0:Math.min(138,Math.round((t-2.7)*30));await setImg(ph.img,clip('search',fi));ph.img.style.transform='none'}
  else if(t<10.4){await setImg(ph.img,'/home/claude/mk/stills/card_wr_c.png');ph.img.style.transform=`translateY(${-seg(t,9.2,10.3,'io')*700}px)`}

  H(8.5,10.4,'<span class="gold">REAL</span> POINTS.',140);
  H(10.4,13.4,'SHARE YOUR <span class="gold">CARD</span>',128,160);
  if(t>=11.3&&t<13.3){cap.style.display='';tf(cap,{y:1700});words(cap,t,[['flex',11.3],['on',11.38],['the',11.44],['group',11.5],['chat',11.58,'#FFC23D'],['😤',11.7]])}
  /* callouts on the card */
  const ron=t>=7.45&&t<9.0;ring.style.display=ron?'':'none';
  if(ron){const zs2=PS*(1+.9*.55),sx=PX-(150*zs2-150*PS),sy=PY-(310*zs2-310*PS);
    const cx=sx+(22+ (20*2.5)*(776/975))*zs2, cy=sy+(22+(148*2.5)*(776/975))*zs2;
    tf(ring,{x:cx-85+sh.x,y:cy+5+sh.y,s:1,o:1-seg(t,8.7,9.0)});document.getElementById('rg').setAttribute('stroke-dashoffset',1000*(1-seg(t,7.45,7.85,'io')))}
  const son=t>=7.9&&t<9.0;sticker.style.display=son?'':'none';arrow.style.display=son?'':'none';
  if(son){const u=seg(t,7.9,8.12,'back');tf(sticker,{x:300,y:1240,s:lerp(2,1,u),r:-4,o:u>0?1:0,blur:0});tf(arrow,{x:250,y:1080,s:1,o:1});document.getElementById('ar').setAttribute('stroke-dashoffset',300*(1-seg(t,8.0,8.25)));document.getElementById('ah').setAttribute('opacity',t>8.22?1:0)}

  /* end */
  const en=t>=13.4;end.style.display=en?'':'none';
  if(en){const u=seg(t,13.4,13.8,'back');tf(end,{y:lerp(560,480,u)+sh.y*.5,s:lerp(1.25,1,u),o:seg(t,13.4,13.6)})}
  st(flash,{opacity:CUTS.map(c=>t>=c&&t<c+.12?(1-(t-c)/.12)*.5:0).reduce((a,b)=>Math.max(a,b),0)});
