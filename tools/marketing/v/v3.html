</div><script src="lib.js"></script><script src="end.js"></script><script>
const PX=220,PY=560,PS=.78;const ph=phone();ph.style.transformOrigin='0 0';

const hook=el(`<div class="h1" style="font-size:146px;text-align:center;width:1080px;line-height:.88"><div id="k1">RANDOM SCHOOL.</div><div id="k2">PICK ONE PLAYER.</div><div id="k3" class="gold">BEAT THE AI.</div></div>`);
const head=el('','abs h1');st(head,{fontSize:'112px',width:'1080px',textAlign:'center',padding:'0 50px'});

async function render(t){
  const sh=shake(t);
  const hk=t<2.2;hook.style.display=hk?'':'none';

  tf(ph,{x:X+sh.x,y:Y+sh.y,s:zs,r:sh.r,o,blur:bl});ph.style.display=t<14.2?'':'none';
  await setImg(ph.img,clip('ring',Math.min(699,fi)));

  H(t,2.25,4.6,'SPIN A <span class="gold">RANDOM SCHOOL</span>',112);

  flashes(flash,t,CUTS);
