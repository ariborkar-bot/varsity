<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="lib.css">
<style>
#cam{position:absolute;inset:0;transform-origin:540px 960px}
.hud{position:absolute;left:60px;width:960px;top:330px;display:flex;gap:14px;z-index:20}
.hud i{flex:1;height:30px;border-radius:8px;background:rgba(0,0,0,.45);border:4px solid rgba(255,255,255,.85);position:relative;box-shadow:0 6px 0 rgba(0,0,0,.5)}
.hud i b{position:absolute;inset:0;border-radius:4px;transform-origin:0 50%}
.zl{position:absolute;left:0;width:1080px;top:385px;text-align:center;font:400 46px Mono1;color:#fff;text-shadow:5px 5px 0 #000;z-index:20;letter-spacing:2px}
.hook{position:absolute;left:40px;width:1000px;top:600px;text-align:center;font:400 104px/1.05 Mono1;color:#fff;z-index:21;
 text-shadow:7px 7px 0 #000,-3px -3px 0 #000,3px -3px 0 #000,-3px 3px 0 #000}
.hook em{font-style:normal;color:#ffd23d}
#end{position:absolute;inset:0;opacity:0;z-index:40;background:#07060f;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#end .grid{position:absolute;left:-400px;right:-400px;bottom:-200px;height:900px;background-image:linear-gradient(#ff2bd6 3px,transparent 3px),linear-gradient(90deg,#ff2bd6 3px,transparent 3px);background-size:120px 120px;transform:perspective(500px) rotateX(62deg);transform-origin:50% 100%;opacity:.55}
#end .sun{position:absolute;left:50%;top:300px;width:620px;height:620px;margin-left:-310px;border-radius:50%;background:linear-gradient(#ffd23d,#ff2bd6 70%);opacity:.25;filter:blur(2px)}
#end .q{font:400 92px/1.1 Mono1;color:#fff;text-shadow:6px 6px 0 #ff2bd6;position:relative}
#end .q .emo{text-shadow:none}
#end .s{font:700 46px/1.3 TT;color:#d9d3ff;margin-top:34px;position:relative}
#end .brand{display:flex;align-items:center;gap:30px;margin-top:80px;position:relative}
#end .brand img{width:170px;height:170px;border-radius:40px;box-shadow:0 0 0 5px #26f0ff,0 0 50px #26f0ff}
#end .brand div{text-align:left}
#end .brand b{display:block;font:400 64px Mono1;color:#fff}
#end .brand small{display:block;font:700 42px TT;color:#26f0ff;margin-top:6px}
#end .pill{position:relative;margin-top:56px;font:400 44px Mono1;color:#07060f;background:#ffd23d;padding:24px 50px;border-radius:18px;box-shadow:8px 8px 0 #ff2bd6}
</style></head><body><div id="stage">
 <div id="cam"><div class="full"><img id="im"></div></div>
 <div class="hud" id="hud"><i><b></b></i><i><b></b></i><i><b></b></i><i><b></b></i><i><b></b></i><i><b></b></i></div>
 <div class="zl" id="zl"></div>
 <div class="hook" id="hook">can you make it<br>to <em>zone 6?</em></div>
 <div id="end"><i class="sun"></i><i class="grid"></i>
  <div class="q">drop your<br>best run <span class="emo">👇</span></div>
  <div class="s">new course every day.<br>same course for everyone.</div>
  <div class="brand"><img src="icon.png"><div><b>VARSITY</b><small>basketball tips off Nov 14</small></div></div>
  <div class="pill">FREE · LINK IN BIO</div></div>
</div>
<script src="lib.js"></script>
<script>
const B=60/160,BAR=4*B;
const ZC=['#ffb15a','#ff5e7a','#7fd0ff','#d6ecff','#ff4fe0','#c9b8ff'];
const ZN=['HOME GYM','SUNSET BLACKTOP','ARENA LIGHTS','ICE COURT','NEON STREETBALL','ZERO GRAVITY'];
// [start, end, clip, f0, f1]
const SEG=[[0,BAR,'hoops',62,118],[BAR,2*BAR,'hoops',150,212],[2*BAR,3*BAR,'hoops',468,536],[3*BAR,4*BAR,'hoops',1068,1136],
 [4*BAR,5*BAR,'hoops2',112,180],[5*BAR,6*BAR,'hoops2',322,390],[6*BAR,8*BAR,'hoops2',532,679]];
const im=document.getElementById('im'),cam=document.getElementById('cam'),hud=document.getElementById('hud'),zl=document.getElementById('zl'),hook=document.getElementById('hook'),end=document.getElementById('end');
const bars=[...hud.querySelectorAll('b')];
const beats=[];for(let x=BAR;x<12;x+=B)beats.push(x);
async function render(t){
  const sg=SEG.find(s=>t>=s[0]&&t<s[1])||SEG[SEG.length-1];
  const f=sg[3]+(sg[4]-sg[3])*cl((t-sg[0])/(sg[1]-sg[0]));await setImg(im,clip(sg[2],f));
  const z=Math.max(0,SEG.indexOf(sg)-1);  // zone index (hook bar = zone 1 too)
  const cut=SEG.indexOf(sg)>0?sg[0]:-9;
  const h=hand(t,.6),k=hit(t,cut,18,.3),p=punch(t,beats,.03)+(t>=cut&&t<cut+.2?.08*(1-(t-cut)/.2):0);
  tf(cam,{x:h.x+k.x,y:h.y+k.y,r:h.r,s:1.02+p});
  // HUD progress: lit segments in zone colours, current one fills over its bar
  const show=t<12;hud.style.opacity=show?1:0;zl.style.opacity=0;
  bars.forEach((b,i)=>{b.style.background=ZC[i];let fill=i<z?1:i===z&&t>=BAR?cl((t-sg[0])/(sg[1]-sg[0])):0;if(t<BAR)fill=0;b.style.transform=`scaleX(${fill})`;
    b.parentElement.style.borderColor=i===z&&t>=BAR?'#fff':'rgba(255,255,255,.6)';b.parentElement.style.transform=i===z&&t>=BAR?`scale(${1.08+punch(t,beats,.06)})`:'scale(1)'});
  if(t>=BAR&&t<12){zl.innerHTML=`ZONE ${z+1} · <span style="color:${ZC[z]}">${ZN[z]}</span>`;}
  // hook: on from frame 0, leaves at the first drop
  const hk=seg(t,BAR-.12,BAR+.15,'in');tf(hook,{y:lerp(0,-60,hk),s:(1+punch(t,[0,B,2*B,3*B],.05))*lerp(1,.6,hk),o:1-hk});
  FL.style.opacity=flashAt(t,SEG.slice(1).map(s=>[s[0],.35]).concat([[7*BAR,.6],[12,.5]]),.16);
  // end card
  const e=seg(t,12,12.15);end.style.opacity=e;
  if(e>0){const kk=t-12,bb=punch(t,[12,12+B,12+2*B,12+3*B,13.5,13.5+B,13.5+2*B,13.5+3*B],.05);
    end.querySelector('.grid').style.backgroundPosition=`0 ${(kk*240)%120}px`;
    tf(end.querySelector('.q'),{s:lerp(.4,1,E.back(cl(kk/.35)))+bb,o:cl(kk/.1)});
    tf(end.querySelector('.s'),{y:lerp(30,0,E.out(cl((kk-.3)/.3))),o:cl((kk-.3)/.2)});
    tf(end.querySelector('.brand'),{y:lerp(40,0,E.out(cl((kk-.6)/.3))),o:cl((kk-.6)/.2)});
    tf(end.querySelector('.pill'),{s:lerp(.5,1,E.back(cl((kk-.9)/.3))),o:cl((kk-.9)/.1)})}
}
</script></body></html>
