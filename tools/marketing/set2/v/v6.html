<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="lib.css">
<style>
#cam{position:absolute;inset:0;transform-origin:540px 960px}
.L3{position:absolute;left:0;z-index:20}
.bar{display:inline-block;transform:skewX(-14deg);padding:14px 44px 16px;font:900 italic 96px/1 BC;text-transform:uppercase;letter-spacing:1px;box-shadow:14px 14px 0 rgba(0,0,0,.45)}
.bar>span{display:inline-block;transform:skewX(14deg)}
.k{background:#C6FF3D;color:#07110a}.d{background:#0a0f1c;color:#fff;border-left:16px solid #C6FF3D}
#title{top:250px;left:70px}
#title .bar{display:block;width:max-content;margin-bottom:16px}
#title .t1{font-size:76px}#title .t2{font-size:170px}
#call{top:1300px;left:70px}
#call .bar{display:block;width:max-content;margin-bottom:12px}
#call .n{font-size:150px;color:#C6FF3D}
#call .s{font-size:56px}
#big{position:absolute;left:0;width:1080px;top:300px;text-align:center;z-index:21}
#big .bar{font-size:118px}
#stamp{position:absolute;left:0;width:1080px;top:1240px;text-align:center;z-index:22}
#stamp .bar{font-size:140px}
#fine{position:absolute;left:0;width:1080px;top:1165px;text-align:center;font:700 40px TT;color:#fff;text-shadow:0 2px 10px #000;z-index:22;opacity:0}
#end{position:absolute;inset:0;opacity:0;z-index:40;background:#0a0f1c;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden}
#end .stripe{position:absolute;left:-200px;width:1500px;height:60px;background:#C6FF3D;transform:rotate(-14deg)}
#end img{width:280px;height:280px;border-radius:62px;box-shadow:16px 16px 0 #C6FF3D;position:relative}
#end h1{font:900 italic 200px/1 BC;margin-top:50px;letter-spacing:2px;position:relative}
#end p{font:700 52px/1.25 TT;color:#d7deee;margin-top:12px;position:relative;max-width:900px}
#end .pill{position:relative;margin-top:50px}
#end .pill .bar{font-size:80px}
#end small{position:relative;display:block;margin-top:34px;font:600 36px TT;color:#8f9bb5}
</style></head><body><div id="stage">
 <div id="cam"><div class="full"><img id="im"></div></div>
 <div id="title" class="L3"><div class="bar d t1"><span>every player in San Diego</span></div><div class="bar k t2"><span>RANKED.</span></div></div>
 <div id="call" class="L3"></div>
 <div id="big"><div class="bar k"><span>OVER or UNDER?</span></div></div>
 <div id="stamp"><div class="bar k"><span>LOCKED IN <span class="emo" style="font-style:normal">🔒</span></span></div></div>
 <div id="fine">tokens only · no real money</div>
 <div id="end"><i class="stripe" style="top:220px"></i><i class="stripe" style="bottom:240px"></i><img src="icon.png"><h1>VARSITY</h1><p>stats, over/unders and leagues for your high school</p><div class="pill"><div class="bar k"><span>FREE · LINK IN BIO</span></div></div><small>tokens only · no real money</small></div>
</div>
<script src="lib.js"></script>
<script>
const B=60/130,BAR=4*B;
const $=id=>document.getElementById(id);
const SEG=[[0,BAR,'lb6',0,40],[BAR,2*BAR,'lb6',40,110],[2*BAR,3*BAR,'lb6',120,262],[3*BAR,4*BAR,'props6',0,40],[4*BAR,5*BAR,'props6',40,72],[5*BAR,6*BAR,'props6',72,112],[6*BAR,9,'props6',112,112]];
const beats=[];for(let x=BAR;x<6*BAR;x+=B)beats.push(x);
function slideIn(e,t,a,dx=-900){const k=cl((t-a)/.22);tf(e,{x:lerp(dx,0,E.out(k)),o:k>0?1:0})}
async function render(t){
  const sg=SEG.find(s=>t>=s[0]&&t<s[1])||SEG[SEG.length-1];
  await setImg($('im'),clip(sg[2],sg[3]+(sg[4]-sg[3])*cl((t-sg[0])/(sg[1]-sg[0]))));
  const cut=SEG.indexOf(sg)>0?sg[0]:-9;const h=hand(t,.5),p=punch(t,beats,.022)+(t>=cut&&t<cut+.18?.06*(1-(t-cut)/.18):0);
  tf($('cam'),{x:h.x,y:h.y,r:h.r,s:1.02+p});
  // title (hook): on from frame 0
  const tt=$('title');if(t<BAR){tt.style.opacity=1;const out=seg(t,BAR-.18,BAR,'in');tf(tt,{x:lerp(0,-1200,out),o:1});tt.querySelector('.t2').style.transform=`skewX(-14deg) scale(${1+punch(t,[0,B,2*B,3*B],.05)})`}else tt.style.opacity=0;
  // lower-third callouts
  const call=$('call');
  if(t>=BAR&&t<3*BAR){
    if(t<2*BAR){const v=Math.min(464.1,464.1*E.out(cl((t-BAR-.3)/.7)));
      call.innerHTML=`<div class="bar d s"><span>#1 · Hezekiah Manuel · Hoover QB</span></div><div class="bar d n"><span>${v.toFixed(1)} <small style="font-size:60px;color:#fff">PTS</small></span></div>`;slideIn(call,t,BAR+.15)}
    else{const v=Math.round(Math.min(3700,3700*E.out(cl((t-2*BAR-.1)/.8))));
      call.innerHTML=`<div class="bar d n"><span>${v.toLocaleString()}+ <small style="font-size:60px;color:#fff">PLAYERS</small></span></div><div class="bar k s"><span>stats updated every week</span></div>`;slideIn(call,t,2*BAR+.05)}
  } else if(t>=4*BAR&&t<5*BAR){call.innerHTML=`<div class="bar d s"><span>Zed Hornby · Bishop’s WR</span></div><div class="bar k n" style="color:#07110a"><span>OVER 60.5 <small style="font-size:60px">REC YDS</small></span></div>`;call.style.top='1290px';slideIn(call,t,4*BAR+.1)}
  else call.style.opacity=0;
  if(!(t>=4*BAR&&t<5*BAR))call.style.top='1300px';
  // OVER or UNDER? on the beat switch
  const bo=t>=3*BAR&&t<4*BAR;$('big').style.opacity=bo?1:0;
  if(bo){const k=cl((t-3*BAR)/.16);tf($('big'),{s:lerp(1.6,1,E.out(k))*(1+punch(t,[3*BAR,3*BAR+2*B,3*BAR+3*B],.06)),o:1})}
  // LOCKED IN stamp when the pick locks (props frame ~84)
  const la=5*BAR+(84-72)/(112-72)*BAR;const lo=t>=la&&t<6*BAR;$('stamp').style.opacity=lo?1:0;$('fine').style.opacity=lo?cl((t-la-.3)/.2):0;
  if(lo){const k=cl((t-la)/.14),hh=hit(t,la,16,.3);tf($('stamp'),{x:hh.x,y:hh.y,s:lerp(1.8,1,E.out(k)),r:-3})}
  // end card
  const e=seg(t,6*BAR,6*BAR+.12);$('end').style.opacity=e;
  if(e>0){const k=t-6*BAR,bb=punch(t,[6*BAR,6*BAR+B,6*BAR+2*B,6*BAR+3*B,7*BAR],.04);
    document.querySelectorAll('#end .stripe').forEach((s,i)=>s.style.transform=`rotate(-14deg) translateX(${lerp(i?1400:-1400,0,E.out(cl(k/.4)))}px)`);
    tf($('end').querySelector('img'),{s:lerp(.3,1,E.back(cl(k/.35)))+bb});tf($('end').querySelector('h1'),{x:lerp(-600,0,E.out(cl((k-.1)/.3))),o:cl((k-.1)/.1)});
    tf($('end').querySelector('p'),{o:cl((k-.3)/.2)});tf($('end').querySelector('.pill'),{s:lerp(.5,1,E.back(cl((k-.45)/.3))),o:cl((k-.45)/.1)});tf($('end').querySelector('small'),{o:cl((k-.7)/.2)})}
  FL.style.opacity=0;
}
</script></body></html>
