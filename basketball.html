<script>
/* leagues: new/join panel, player picker for lineup spots, clearing a spot */
(()=>{
  let pk=null;
  const closePk=()=>{if(pk){pk.remove();pk=null}};
  const setSlot=async(slot,key)=>{const g=curGroup();if(!g)return;
    const s=slotsOf(g).find(x=>x.k===slot),cur=pByKey(lineupOf(g.id,ME.uid)[slot]);
    if(s&&!s.bench&&statsIn(cur)){say(LOCK_MSG(cur));return}   /* a starter with stats in is locked */
    await saveLineup(g,{[slot]:key||null})};
  const openPk=slot=>{
    const g=curGroup();if(!g)return;const s=slotsOf(g).find(x=>x.k===slot);if(!s)return;
    const mode=lgMode(g),di=draftInfo(g);
    if(mode==='draft'&&di.status==='pending'){say('The draft has not started yet');return}
    if(mode==='draft'&&di.status==='live'&&di.uid!==ME.uid){say('Wait for your turn to draft');return}
    const mine=lineupOf(g.id,ME.uid),cur=pByKey(mine[slot]);
    if(di.status!=='live'&&!s.bench&&statsIn(cur)){say(LOCK_MSG(cur));return}
    const inMine=new Set(Object.entries(mine).filter(([k])=>k!==slot).map(([,v])=>v));
    const left=mode==='budget'?budgetFor(g,ME.uid,slot):Infinity,totalLeft=mode==='budget'?Math.round((capOf(g)-spent(g,ME.uid))*10)/10:0;
    const all=players().filter(p=>slotOk(s,p)).map(p=>{const a=agg(p,'season'),c=mode==='budget'?priceOf(p):0,pj=proj(p).pts,gm=a.n?a.v/a.n:0;return{p,a,c,pj,gm,val:c?gm/c:0}});
    let sort='pts',aff=false;
    const SORTS=[['pts','Points'],['proj','Projected']].concat(mode==='budget'?[['val','Best value'],['price','Price']]:[]);
    pk=document.createElement('div');pk.className='pk-bg';
    const title=(di.status==='live'?'Draft your ':'Pick your ')+(s.bench?'bench player':s.k==='FLEX'?'FLEX (any position)':s.label);
    pk.innerHTML=`<div class="pk" role="dialog" aria-modal="true" aria-label="${title}"><div class="pk-h"><h3>${title}</h3><button class="lg-x" data-pk="close" aria-label="Close">✕</button></div>
      ${mode==='budget'?`<div class="bd-pkinfo"><div><small>Spend up to</small><b>${money(Math.max(0,left))}</b></div><div><small>Total left</small><b>${money(totalLeft)}</b></div>${cur?`<div><small>Back from ${esc(cur.name.split(' ')[0])}</small><b>${money(priceOf(cur))}</b></div>`:''}</div>`:''}
      <div class="pk-tools"><input type="search" placeholder="Search players or schools" aria-label="Search players"></div>
      <div class="bd-sort chips" role="group" aria-label="Sort by"><span class="muted">Sort</span>${SORTS.map(([k,l])=>`<button class="chip" data-sort="${k}" aria-pressed="${k===sort}">${l}</button>`).join('')}${mode==='budget'?`<button class="chip" data-aff="1" aria-pressed="false">Can afford</button>`:''}</div><ul></ul></div>`;
    const ul=pk.querySelector('ul'),q=pk.querySelector('input');
    const draw=()=>{const v=q.value.trim().toLowerCase();
      let rows=all.filter(x=>(!v||x.p.name.toLowerCase().includes(v)||x.p.school.toLowerCase().includes(v))&&(!aff||x.c<=left));
      rows=rows.sort((x,y)=>sort==='proj'?y.pj-x.pj:sort==='val'?y.val-x.val:sort==='price'?x.c-y.c||y.a.v-x.a.v:y.a.v-x.a.v).slice(0,80);
      ul.innerHTML=rows.length?rows.map(x=>{
        const o=mode==='draft'?ownerOf(g,x.p.key,ME.uid):null,dup=inMine.has(x.p.key),broke=mode==='budget'&&x.c>left,lkd=di.status!=='live'&&!s.bench&&statsIn(x.p);
        const why=o?' · on '+esc(nm(o))+'’s team':dup?' · already in your lineup':broke?' · over by '+money(x.c-left):lkd?' · stats already in this game':'';
        const big=sort==='proj'?f1(x.pj):sort==='val'?x.val.toFixed(2):sort==='price'?money(x.c):f1(x.a.v);
        const cap=sort==='proj'?'proj':sort==='val'?'pts per $M':sort==='price'?'price':'season';
        return `<li><button data-key="${esc(x.p.key)}" ${o||dup||broke||lkd?'disabled':''}>${av(x.p.name,x.p.school,38)}<span class="lt">${T10W(x.p,`<b>${esc(x.p.name)}</b>`)}<i>${pb(x.p.pos,x.p.sub)}<span>${slogo(x.p.school)}${esc(x.p.school)}</span>${why}</i></span><span class="pv"><b>${big}</b><small>${cap}</small></span><span class="pm">${mode==='budget'?'<span class="bd-pill">'+money(x.c)+'</span>':''}<span>${f1(x.a.v)} pts</span><span>${x.a.n?f1(x.gm)+'/gm':'no games'}</span><span>proj ${f1(x.pj)}</span>${mode==='budget'&&x.a.n?'<span>'+x.val.toFixed(2)+' per $M</span>':''}</span></button></li>`}).join(''):'<li class="muted" style="padding:14px">No players match.</li>'};
    draw();q.addEventListener('input',draw);
    pk.addEventListener('click',e=>{const sb=e.target.closest('[data-sort]'),ab=e.target.closest('[data-aff]');
      if(sb){sort=sb.dataset.sort;pk.querySelectorAll('[data-sort]').forEach(x=>x.setAttribute('aria-pressed',String(x===sb)));draw();e.stopPropagation()}
      else if(ab){aff=!aff;ab.setAttribute('aria-pressed',String(aff));draw();e.stopPropagation()}});
    pk.addEventListener('click',async e=>{if(e.target===pk||e.target.closest('[data-pk=close]')){closePk();return}
      const b=e.target.closest('button[data-key]');if(b&&!b.disabled){const k=b.dataset.key;closePk();
        if(mode==='draft'&&di.status==='live'){await draftPick(g,slot,k)}else await setSlot(slot,k)}});
    document.body.appendChild(pk);if(matchMedia('(pointer:fine)').matches)q.focus();
  };
  /* swap two of your own players between a starting spot and a bench spot */
  let sk=null;const closeSk=()=>{if(sk){sk.remove();sk=null}};
  const openSub=slot=>{
    const g=curGroup();if(!g)return;const SL=slotsOf(g),from=SL.find(x=>x.k===slot);if(!from)return;
    const ro=lineupOf(g.id,ME.uid),fp=pByKey(ro[from.k]);if(!fp)return;
    if(statsIn(fp)){say(LOCK_MSG(fp));return}
    const opts=SL.filter(x=>!!x.bench!==!!from.bench).map(x=>({s:x,p:pByKey(ro[x.k])}))
      .filter(o=>slotOk(o.s,fp)&&(!o.p||(slotOk(from,o.p)&&!statsIn(o.p))));   /* both players have to fit their new spot, and neither can have stats in this game */
    if(!opts.length){say(from.bench?'No starting spot fits '+fp.name:'No bench player fits this spot');return}
    closeSk();
    const title=from.bench?'Sub in '+fp.name:'Sub out '+fp.name;
    const row=o=>`<li><button data-sub="${o.s.k}"><span class="lg-slot">${o.s.label}</span><span class="lt">${o.p?`${T10W(o.p,`<b>${esc(o.p.name)}</b>`)}<i>${pb(o.p.pos,o.p.sub)}<span>${esc(o.p.school)}</span></i>`:`<b class="muted">Empty ${from.bench?'starting':'bench'} spot</b>`}</span><span class="pv"><b>${o.p?f1(agg(o.p,'season').v):'-'}</b><small>season pts</small></span></button></li>`;
    sk=document.createElement('div');sk.className='pk-bg';
    sk.innerHTML=`<div class="pk" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="pk-h"><h3>${esc(title)}</h3><button class="lg-x" data-pk="close" aria-label="Close">✕</button></div><p class="pk-sum">${from.bench?'Choose the starting spot to move them into.':'Choose who takes this spot from the bench.'} The two players trade places, so nobody is dropped.</p><ul>${opts.map(row).join('')}</ul></div>`;
    sk.addEventListener('click',async e=>{
      if(e.target===sk||e.target.closest('[data-pk=close]')){closeSk();return}
      const b=e.target.closest('button[data-sub]');if(!b)return;
      const o=opts.find(x=>x.s.k===b.dataset.sub);if(!o)return;closeSk();
      await saveLineup(g,{[from.k]:o.p?o.p.key:null,[o.s.k]:fp.key},
        from.bench?fp.name+' moved into '+o.s.label:fp.name+' moved to the bench');
    });
    document.body.appendChild(sk);
  };
  /* checklist of a team's players for the trade windows */
  const trList=(g,uid,name,sel,skip)=>{
    const ro=lineupOf(g.id,uid);
    const rows=slotsOf(g).map(s=>({s,p:pByKey(ro[s.k])})).filter(o=>o.p&&!(skip&&skip.has(o.p.key)));
    return rows.map(o=>{const lk=statsIn(o.p);return `<label class="tr-pl ${lk?'lk':''}"><input type="checkbox" data-tr="${name}" value="${esc(o.p.key)}" ${sel.has(o.p.key)?'checked':''} ${lk?'disabled':''}><span>${T10W(o.p,`<b>${esc(o.p.name)}</b>`)} <small class="muted">${o.p.pos==='DEF'?esc(o.p.sub||'DEF'):o.p.pos} · ${esc(o.s.label)}${o.s.bench?' (bench)':''}${lk?' · locked, has stats this game':''}</small></span></label>`}).join('')||'<p class="hint">No players</p>';
  };
  const openTrade=()=>{
    const g=curGroup();if(!g||!tradesOn(g))return;
    const others=Object.keys(g.members).filter(u=>u!==ME.uid);if(!others.length){say('You need another team in the league');return}
    const st={to:others[0],give:new Set(),want:new Set(),drop:new Set()};
    const draw=()=>{
      const old=sk&&sk.querySelector('.tr-form'),top=old?old.scrollTop:0;closeSk();
      const give=[...st.give],want=[...st.want],need=dropsNeeded(g,ME.uid,give,want);
      st.drop=new Set([...st.drop].filter(k=>!st.give.has(k)));
      const drop=[...st.drop];
      let msg='',ok=false;
      if(!give.length||!want.length)msg='Pick at least one player on each side.';
      else if(drop.length<need)msg=`You get ${want.length} and send ${give.length}, so drop ${need-drop.length} more player${need-drop.length===1?'':'s'} to make room.`;
      else if(!planSide(g,ME.uid,give,want,drop))msg='Those players do not fit your open spots. Try dropping someone at a matching position.';
      else{ok=true;const tn=dropsNeeded(g,st.to,want,give);msg=tn>0?`${nm(st.to)} would have to drop ${tn} player${tn===1?'':'s'} to make room, and they choose who.`:''}
      sk=document.createElement('div');sk.className='pk-bg';
      sk.innerHTML=`<div class="pk" role="dialog" aria-modal="true" aria-label="Propose a trade"><div class="pk-h"><h3>Propose a trade</h3><button class="lg-x" data-pk="close" aria-label="Close">✕</button></div>
        <div class="tr-form">
          <label class="fld"><span>Trade with</span><select data-tr="to">${others.map(u=>`<option value="${esc(u)}" ${u===st.to?'selected':''}>${esc(nm(u))}</option>`).join('')}</select></label>
          <div class="tr-col"><b>You send (${give.length})</b>${trList(g,ME.uid,'give',st.give)}</div>
          <div class="tr-col"><b>You get from ${esc(nm(st.to))} (${want.length})</b>${trList(g,st.to,'want',st.want)}</div>
          ${need>0||drop.length?`<div class="tr-col"><b>You drop (${drop.length} of ${need} needed)</b><small class="muted">Dropped players go back to free agency.</small>${trList(g,ME.uid,'drop',st.drop,st.give)}</div>`:''}
          <p class="tr-err" id="tr-err">${esc(msg)}</p>
          <button class="btn" data-tr="send" ${ok?'':'disabled'}>Send trade offer</button>
        </div></div>`;
      sk.addEventListener('click',async e=>{
        if(e.target===sk||e.target.closest('[data-pk=close]')){closeSk();return}
        if(!e.target.closest('[data-tr=send]'))return;
        const gg=curGroup(),t={id:'t'+NOW(),from:ME.uid,to:st.to,give:[...st.give],want:[...st.want],fdrop:[...st.drop],status:'pending',at:NOW()};
        const why=tradeProblem(gg,t);
        if(why){const el=document.getElementById('tr-err');if(el)el.textContent=why;return}
        closeSk();await act(()=>upsert('groups/'+gg.id,{trades:{[t.id]:t}}),'Trade offer sent to '+nm(st.to));
      });
      sk.addEventListener('change',e=>{
        const k=e.target.dataset&&e.target.dataset.tr;if(!k)return;
        if(k==='to'){st.to=e.target.value;st.want=new Set()}
        else{const S=st[k];e.target.checked?S.add(e.target.value):S.delete(e.target.value)}
        draw();
      });
      document.body.appendChild(sk);const nf=sk.querySelector('.tr-form');if(nf)nf.scrollTop=top;
    };
    draw();
  };
  /* the team accepting picks who to drop if the trade leaves it with too many players */
  const openTradeDrops=(g,t,need)=>{
    const give=trArr(t.give),want=trArr(t.want),sel=new Set();closeSk();
    const draw=()=>{
      const old=sk&&sk.querySelector('.tr-form'),top=old?old.scrollTop:0;closeSk();
      const drop=[...sel];let msg='',ok=false;
      if(drop.length<need)msg=`Choose ${need-drop.length} more player${need-drop.length===1?'':'s'} to drop.`;
      else{const why=tradeProblem(g,t,drop);if(why)msg=why;else ok=true}
      sk=document.createElement('div');sk.className='pk-bg';
      sk.innerHTML=`<div class="pk" role="dialog" aria-modal="true" aria-label="Choose who to drop"><div class="pk-h"><h3>Make room for the trade</h3><button class="lg-x" data-pk="close" aria-label="Close">✕</button></div>
        <div class="tr-form"><p class="pk-sum">You get ${trNames(give)} and send ${trNames(want)}. Your roster is over by ${need}, so drop ${need} player${need===1?'':'s'}. They go back to free agency.</p>
          <div class="tr-col"><b>You drop (${drop.length} of ${need})</b>${trList(g,ME.uid,'drop',sel,new Set(want))}</div>
          <p class="tr-err" id="tr-err">${esc(msg)}</p><button class="btn" data-tr="go" ${ok?'':'disabled'}>Accept trade</button></div></div>`;
      sk.addEventListener('click',async e=>{
        if(e.target===sk||e.target.closest('[data-pk=close]')){closeSk();return}
        if(e.target.closest('[data-tr=go]')){closeSk();finishAccept(t.id,[...sel])}
      });
      sk.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.tr;if(k!=='drop')return;e.target.checked?sel.add(e.target.value):sel.delete(e.target.value);draw()});
      document.body.appendChild(sk);const nf=sk.querySelector('.tr-form');if(nf)nf.scrollTop=top;
    };
    draw();
  };
  const finishAccept=async(id,dropsTo)=>{
    const g=curGroup();if(!g)return;const t=(g.trades||{})[id];if(!t||t.status!=='pending'){say('That trade is no longer open');return}
    const why=tradeProblem(g,t,dropsTo);if(why){say(why);return}
    const give=trArr(t.give),want=trArr(t.want);
    const fc=planSide(g,t.from,give,want,trArr(t.fdrop)),tc=planSide(g,t.to,want,give,dropsTo);
    await act(()=>upsert('groups/'+g.id,{trades:{[id]:{status:'accepted',w:CURW(),at:NOW(),fc,tc,td:dropsTo}}}),'Trade done. It counts from game '+CURW());
  };
  const tradeAct=async(id,kind)=>{
    const g=curGroup();if(!g)return;const t=(g.trades||{})[id];if(!t||t.status!=='pending'){say('That trade is no longer open');return}
    if(kind==='accept'){
      if(t.to!==ME.uid)return;
      const give=trArr(t.give),want=trArr(t.want),need=dropsNeeded(g,ME.uid,want,give);
      if(need>0||planSide(g,t.to,want,give,[])===null){
        const why=tradeProblem(g,t,null);if(why){say(why);return}
        openTradeDrops(g,t,Math.max(need,1));return}
      return finishAccept(id,[])}
    if(kind==='decline'&&t.to===ME.uid)await act(()=>upsert('groups/'+g.id,{trades:{[id]:{status:'declined'}}}),'Trade declined');
    if(kind==='cancel'&&t.from===ME.uid)await act(()=>upsert('groups/'+g.id,{trades:{[id]:{status:'cancelled'}}}),'Trade offer cancelled');
  };
  const draftPick=window.draftPick=async(g,slot,key,isAuto)=>{
    const fresh=S.groups[g.id]?Object.assign({id:g.id},S.groups[g.id]):g,di=draftInfo(fresh);
    if(di.status!=='live'||di.uid!==ME.uid){say('That pick is no longer yours');return}
    if(ownerOf(fresh,key,null)){say('Someone already drafted that player');return}
    const ok=await act(()=>upsert('groups/'+g.id,{draft:{picks:{[di.i]:Object.assign({uid:ME.uid,key,slot,at:NOW()},isAuto?{auto:true}:{})}}}));
    if(ok){window.__draftLocal&&window.__draftLocal()}
  };
  document.addEventListener('keydown',e=>{if(pk&&e.key==='Escape')closePk();if(sk&&e.key==='Escape')closeSk()});
  document.addEventListener('click',async e=>{
    const t=e.target.closest&&e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
    if(a==='lgPanel'){UI.lgp=UI.lgp===t.dataset.v?null:t.dataset.v;render();const f=document.querySelector(UI.lgp==='new'?'#new-name':'#join-code');if(f)f.focus()}
    else if(a==='lgPick'){if(typeof needJoin==='function'&&needJoin('build a lineup'))return;openPk(t.dataset.slot)}
    else if(a==='lgClear'){await setSlot(t.dataset.slot,null)}
    else if(a==='budFill'||a==='budBest'){const g=curGroup();if(!g)return;
      const go=async()=>{const r=autoBuild(g,ME.uid,a==='budBest');
        if(!r){say('The budget is too small to fill every spot.');return}
        const changed=Object.entries(r.patch).filter(([k,v])=>v!==(lineupOf(g.id,ME.uid)[k]||null));
        if(!changed.length){say('That is already the best team your budget allows.');return}
        await saveLineup(g,r.patch,'Built your team with '+money(r.left)+' left to spend')};
      const filled=slotsOf(g).some(x=>pByKey(lineupOf(g.id,ME.uid)[x.k]));
      if(a==='budBest'&&filled)confirmBox('Rebuild your team?','This swaps your current players for the highest-scoring team the budget allows. Players whose stats are in this game stay put.','Rebuild',go);else go()}
    else if(a==='budClear'){const g=curGroup();if(!g)return;
      confirmBox('Clear your whole team?','Every player goes back in the pool and you get all of your budget back. Players whose stats are in this game stay put.','Clear all',async()=>{
        const ro=lineupOf(g.id,ME.uid),patch={};slotsOf(g).forEach(x=>{const p=pByKey(ro[x.k]);if(p&&!(!x.bench&&statsIn(p)))patch[x.k]=null});
        if(Object.keys(patch).length)await saveLineup(g,patch,'Team cleared')})}
    else if(a==='lgSub')openSub(t.dataset.slot)
    else if(a==='chatSend')sendChat();
    else if(a==='chatDel'){const g=curGroup(),m=g&&(g.chat||{})[t.dataset.id];if(m&&m.u===ME.uid)await act(()=>upsert('groups/'+g.id,{chat:{[t.dataset.id]:null}}),'Message deleted')}
    else if(a==='fcDeal')fcDeal()
    else if(a==='fcRedraw')fcRedraw(+t.dataset.i)
    else if(a==='simStart')simStart()
    else if(a==='simRespin')simRespin(+t.dataset.i)
    else if(a==='simTab'){UI.simTab=t.dataset.v==='def'?'def':'off';render()}
    else if(a==='simFinish')simFinish()
    else if(a==='simReset'){UI.sim=null;render()}
    else if(a==='simSeason'){if(UI.sim){UI.sim.stage='pick';render();window.scrollTo(0,0)}}
    else if(a==='simBack'){if(UI.sim){UI.sim.stage=UI.sim.season?'season':null;render()}}
    else if(a==='simPick'){try{document.activeElement.blur()}catch(_){}simRun(t.dataset.s);window.scrollTo(0,0)}
    else if(a==='simAgain'){if(UI.sim&&UI.sim.season){simRun(UI.sim.season.school)}}
    else if(a==='fcLock')fcLock()
    else if(a==='fcWeek'){UI.fcw=+t.dataset.v;render()}
    else if(a==='fcBoard'){UI.fcb=t.dataset.v;render()}
    else if(a==='trNew')openTrade()
    else if(a==='trAccept')tradeAct(t.dataset.id,'accept')
    else if(a==='trDecline')tradeAct(t.dataset.id,'decline')
    else if(a==='trCancel')tradeAct(t.dataset.id,'cancel')
    else if(a==='lgRoster'){const g=curGroup();if(!g||g.ownerId!==ME.uid)return;
      const d=g.draft;if(d&&(d.order||d.status==='live'||d.status==='done')){say('The roster is locked once the draft starts');return}
      const r=readRoster('ro-edit'),n=rosterCount(r);if(n<1||n>ROSTER_TOTAL_MAX){say('Pick between 1 and '+ROSTER_TOTAL_MAX+' spots');return}
      await act(()=>upsert('groups/'+g.id,{roster:cleanRoster(r)}),'Roster saved: '+rosterText(r))}
    else if(a==='lgDraftStart'){const g=curGroup();if(!g||g.ownerId!==ME.uid)return;
      const ids=Object.keys(g.members);if(ids.length<2){say('Invite at least one friend first');return}
      const order=ids.map(u=>[Math.random(),u]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
      const ck=$('#dclock')?+$('#dclock').value:90;
      await act(()=>upsert('groups/'+g.id,{roster:cleanRoster(g.roster||ROSTER_DEFAULT),draft:{status:'live',order,startedAt:NOW(),clock:ck,picks:{}}}),'The draft has started')}
  });
})();

<script>
/* Opening animation: once each time the app opens. Tap anywhere (or Skip) to jump straight in.

const __introRun=()=>{

  let seen=false;try{seen=sessionStorage.getItem('vs-intro')==='1'}catch(_){}
  if(seen||matchMedia('(prefers-reduced-motion: reduce)').matches||!el.animate){el.remove();return}
  try{sessionStorage.setItem('vs-intro','1')}catch(_){}
  el.hidden=false;el.classList.add('go');document.documentElement.style.overflow='hidden';
  const $$=s=>el.querySelector(s),stage=$$('.in-stage'),gem=$$('.in-gem'),med=$$('.in-med'),halo=$$('.in-halo'),letters=[...el.querySelectorAll('.in-word span')],
    word=$$('.in-word'),turf=$$('.in-turf'),tag=$$('.in-tag'),run=$$('.in-run'),drun=$$('.in-drun'),flash=$$('.in-flash'),boom=$$('.in-boom'),
    ball=$$('.in-ball'),white=$$('.in-white'),cv=$$('canvas'),cx=cv.getContext('2d');
  const anims=[];const A=(n,k,o)=>{const a=n.animate(k,Object.assign({fill:'both'},o));a.playbackRate=RATE;anims.push(a);return a};
  let done=false,timers=[],raf=0;

  const RATE=3.2;
  const at=(ms,f)=>timers.push(setTimeout(f,ms/RATE));
  const finish=()=>{if(done)return;done=true;timers.forEach(clearTimeout);cancelAnimationFrame(raf);
    /* draw the app behind the intro first, then fade, so the fade never stutters while the app builds */
    try{window.releaseHold&&window.releaseHold()}catch(_){}
    const fade=()=>requestAnimationFrame(()=>{el.classList.add('out');setTimeout(()=>{el.remove();document.documentElement.style.overflow=''},270)});
    requestAnimationFrame(()=>requestAnimationFrame(()=>window.requestIdleCallback?requestIdleCallback(fade,{timeout:200}):setTimeout(fade,120)))};
  el.addEventListener('pointerdown',finish);
  el.querySelector('.in-skip').addEventListener('click',finish);

  /* ---------- the two players ---------- */
  const fig=c=>`<svg viewBox="0 0 120 120"><g class="pl" style="transform-origin:58px 100px">
    <g class="aB" style="transform-origin:61px 44px"><path d="M61 44V58" stroke="${c.jd}" stroke-width="7" stroke-linecap="round"/><g class="fB" style="transform-origin:61px 58px"><path d="M61 58V70" stroke="${c.skin}" stroke-width="5.5" stroke-linecap="round"/></g></g>
    <g class="tB" style="transform-origin:57px 68px"><path d="M57 68V84" stroke="${c.pd}" stroke-width="9" stroke-linecap="round"/><g class="sB" style="transform-origin:57px 84px"><path d="M57 84V99" stroke="${c.pd}" stroke-width="8" stroke-linecap="round"/><ellipse cx="60" cy="101" rx="7.5" ry="3.4" fill="#10161f"/></g></g>
    <g class="tr" style="transform-origin:58px 70px"><path d="M49 42Q60 35 70 42L67 70Q58 75 50 70Z" fill="${c.j}"/><rect x="55" y="50" width="8" height="11" rx="1.6" fill="${c.num}" opacity=".9"/><path d="M49 66H67V74Q58 78 49 74Z" fill="${c.p}"/><path d="M49 42Q60 35 70 42L69 47Q60 41 50 47Z" fill="#fff" opacity=".22"/></g>
    <g class="tN" style="transform-origin:57px 68px"><path d="M57 68V84" stroke="${c.p}" stroke-width="9.5" stroke-linecap="round"/><g class="sN" style="transform-origin:57px 84px"><path d="M57 84V99" stroke="${c.p}" stroke-width="8.5" stroke-linecap="round"/><ellipse cx="60" cy="101" rx="7.5" ry="3.4" fill="#0a0f16"/></g></g>
    <g class="aN" style="transform-origin:61px 44px"><path d="M61 44V58" stroke="${c.j}" stroke-width="7.5" stroke-linecap="round"/><g class="fN" style="transform-origin:61px 58px"><path d="M61 58V70" stroke="${c.skin}" stroke-width="5.8" stroke-linecap="round"/>${c.ball?'<g class="bl"><ellipse cx="62" cy="71" rx="9" ry="5.2" fill="#8B4A1E" transform="rotate(-18 62 71)"/><path d="M57 70.5L67 68.5" stroke="#fff" stroke-width="1.3"/></g>':''}</g></g>
    <circle cx="65" cy="26" r="11.5" fill="${c.h}"/><path d="M54 24Q65 12 76 24" stroke="${c.st}" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M72 23Q81 27 76 37" stroke="#DCE6FF" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M73 29H79" stroke="#DCE6FF" stroke-width="1.6" stroke-linecap="round"/>
  </g></svg>`;
  const CARRIER={j:'#F2F6FF',jd:'#C3D2F2',p:'#2A4FC4',pd:'#1C3A96',skin:'#D9A47A',h:'#2F6BFF',st:'#fff',num:'#2F6BFF',ball:1};
  const DEFENDER={j:'#FFC23D',jd:'#D99A12',p:'#2B2F3A',pd:'#1B1E27',skin:'#D9A47A',h:'#F0A800',st:'#2B2F3A',num:'#2B2F3A',ball:0};
  run.querySelector('.in-fl').innerHTML=fig(CARRIER);drun.querySelector('.in-fl').innerHTML=fig(DEFENDER);
  drun.querySelector('.in-fl').style.transform='scaleX(-1)';
  const PMS=360;
  const cycle=(root,carry)=>{
    const q=s=>root.querySelector(s),out=[],o=(ph,d)=>({duration:(d||PMS)/RATE,iterations:Infinity,delay:-ph*(d||PMS)/RATE,easing:'linear'});
    const leg=(t,s,ph)=>{
      out.push(q(t).animate([{transform:'rotate(-52deg)'},{transform:'rotate(-14deg)',offset:.25},{transform:'rotate(36deg)',offset:.5},{transform:'rotate(-8deg)',offset:.75},{transform:'rotate(-52deg)'}],o(ph)));
      out.push(q(s).animate([{transform:'rotate(16deg)'},{transform:'rotate(6deg)',offset:.25},{transform:'rotate(14deg)',offset:.5},{transform:'rotate(108deg)',offset:.75},{transform:'rotate(16deg)'}],o(ph)))};
    leg('.tB','.sB',0);leg('.tN','.sN',.5);
    out.push(q('.aB').animate([{transform:'rotate(58deg)'},{transform:'rotate(-58deg)'},{transform:'rotate(58deg)'}],o(0)));
    out.push(q('.fB').animate([{transform:'rotate(-70deg)'},{transform:'rotate(-105deg)'},{transform:'rotate(-70deg)'}],o(0)));
    if(carry){q('.aN').style.transform='rotate(-24deg)';q('.fN').style.transform='rotate(-112deg)'}
    else{out.push(q('.aN').animate([{transform:'rotate(-58deg)'},{transform:'rotate(58deg)'},{transform:'rotate(-58deg)'}],o(0)));out.push(q('.fN').animate([{transform:'rotate(-105deg)'},{transform:'rotate(-70deg)'},{transform:'rotate(-105deg)'}],o(0)))}
    out.push(q('.pl').animate([{transform:'translateY(0) rotate(9deg)'},{transform:'translateY(-5px) rotate(11deg)'},{transform:'translateY(0) rotate(9deg)'}],o(.12)));
    return out};
  const pose=(root,m)=>{for(const k in m){const n=root.querySelector(k);if(n)n.style.transform='rotate('+m[k]+'deg)'}};
  let cyc=[];

  /* ---------- canvas: stadium + particles ---------- */
  const DPR=Math.min(2,devicePixelRatio||1);let CW=0,CH=0;
  const size=()=>{CW=innerWidth;CH=innerHeight;cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR)};size();
  const R=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),eo=t=>1-Math.pow(1-clamp(t,0,1),3);
  const P=[],rings=[],flares=[],trails=[];
  const emit=o=>P.push(Object.assign({age:0,life:800,x:0,y:0,vx:0,vy:0,grav:0,drag:.985,sz:2,col:'255,255,255',a:1,add:1,k:'dot',rot:0,vr:0},o));
  const motes=Array.from({length:24},()=>({x:Math.random(),y:Math.random(),s:R(.6,2.1),v:R(4,16),ph:Math.random()*6.28}));
  const sr0=stage.getBoundingClientRect();
  let groundY=turf.getBoundingClientRect().top,speedOn=false,tScroll=0,shakeX=0,shakeY=0,hold=0,boost=0;
  const t0=performance.now();let last=t0,now=0;
  const frame=t=>{
    if(done)return;raf=requestAnimationFrame(frame);
    let dt=Math.min(50,t-last);last=t;if(hold>0){hold-=dt;dt=0}now=t-t0;
    cx.setTransform(DPR,0,0,DPR,0,0);cx.clearRect(0,0,CW,CH);cx.globalCompositeOperation='source-over';
    const tin=eo(now/600),gy=groundY,vpy=gy-CH*.12;
    /* turf plane in perspective */
    if(tin>0){
      cx.save();cx.globalAlpha=tin;
      let g=cx.createLinearGradient(0,gy,0,CH);g.addColorStop(0,'rgba(20,70,170,.0)');g.addColorStop(.35,'rgba(14,52,140,.45)');g.addColorStop(1,'rgba(6,26,80,.85)');cx.fillStyle=g;cx.fillRect(0,gy,CW,CH-gy);
      cx.beginPath();cx.rect(0,gy,CW,CH-gy);cx.clip();
      cx.strokeStyle='rgba(150,195,255,.26)';cx.lineWidth=1.4;
      for(let i=-5;i<=5;i++){cx.beginPath();cx.moveTo(CW/2+i*CW*.06,gy);cx.lineTo(CW/2+i*CW*.34,CH);cx.stroke()}
      tScroll+=dt*(speedOn?.0011:.00025);const N=7;
      for(let k=0;k<N;k++){const f=((k+tScroll)%N)/N,y=gy+(CH-gy)*Math.pow(f,2.1);cx.globalAlpha=tin*(.15+f*.5);cx.lineWidth=1+f*2.4;cx.beginPath();cx.moveTo(0,y);cx.lineTo(CW,y);cx.stroke()}
      cx.restore();
      cx.globalAlpha=1;
    }
    cx.globalCompositeOperation='lighter';
    /* stadium light beams */
    for(let i=0;i<3;i++){
      const ox=CW*(.16+i*.34),oy=-30,sw=Math.sin(now/1700+i*2.1)*CW*.05,tx=CW*.5+(i-1)*CW*.2+sw,ty=CH*.9,w0=CW*.015,w1=CW*(.1+.02*i);
      const a=tin*(.1+.04*Math.sin(now/600+i*1.7))*(1+boost);
      const g=cx.createLinearGradient(ox,oy,tx,ty);g.addColorStop(0,`rgba(190,215,255,${a*2.2})`);g.addColorStop(.6,`rgba(120,170,255,${a})`);g.addColorStop(1,'rgba(80,130,255,0)');
      cx.fillStyle=g;cx.beginPath();cx.moveTo(ox-w0,oy);cx.lineTo(ox+w0,oy);cx.lineTo(tx+w1,ty);cx.lineTo(tx-w1,ty);cx.closePath();cx.fill();
      const rg=cx.createRadialGradient(ox,0,0,ox,0,CW*.12);rg.addColorStop(0,`rgba(220,235,255,${tin*.55})`);rg.addColorStop(1,'rgba(220,235,255,0)');cx.fillStyle=rg;cx.fillRect(ox-CW*.12,0,CW*.24,CW*.12);
    }
    /* dust in the light */
    for(const m of motes){m.y-=m.v*dt/1000/CH*60;m.x+=Math.sin(now/1300+m.ph)*.0002;if(m.y<-.02)m.y=1.02;cx.fillStyle=`rgba(190,215,255,${tin*(.12+.18*Math.abs(Math.sin(now/900+m.ph)))})`;cx.beginPath();cx.arc(m.x*CW,m.y*CH,m.s,0,6.283);cx.fill()}
    /* speed lines behind the sprinters */
    if(speedOn){
      for(const [n,dir] of [[run,-1],[drun,1]]){const r=n.getBoundingClientRect();if(r.right<-20||r.left>CW+20)continue;
        const x0=dir<0?r.left+r.width*.3:r.right-r.width*.3;
        for(let i=0;i<7;i++){const y=r.top+r.height*(.18+.72*(i/6))+R(-3,3),L=R(60,170),a=R(.18,.5);
          const g=cx.createLinearGradient(x0,0,x0+dir*L,0);g.addColorStop(0,`rgba(200,225,255,${a})`);g.addColorStop(1,'rgba(200,225,255,0)');cx.strokeStyle=g;cx.lineWidth=R(1,2.4);cx.beginPath();cx.moveTo(x0,y);cx.lineTo(x0+dir*L,y);cx.stroke()}}
    }
    /* anamorphic flares */
    for(let i=flares.length-1;i>=0;i--){const f=flares[i],u=(now-f.t0)/f.dur;if(u>=1){flares.splice(i,1);continue}
      const e=Math.sin(Math.min(1,u*1.4)*Math.PI/2)*(1-u),L=f.len*(.3+.7*eo(u*2));

  document.addEventListener('click',async e=>{
    const t=e.target.closest&&e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
    if(a==='dtab'){UI.dtab=t.dataset.v;render()}
    else if(a==='dpos'){UI.dpos=t.dataset.v;render()}
    else if(a==='dSound'){try{localStorage.setItem('vs-snd',sndOn()?'off':'on')}catch(_){}if(sndOn())sndClock();render()}
    else if(a==='dPick'){const g=curGroup();if(!g)return;const p=pByKey(t.dataset.key);const s=openSlots(g,ME.uid).find(x=>slotOk(x,p));if(!s){say('No open spot for that position');return}t.disabled=true;await draftPick(g,s.k,p.key)}
  });
  document.addEventListener('change',async e=>{
    const t=e.target;if(!t||t.dataset.act!=='dAuto')return;const g=curGroup();if(!g)return;
    await act(()=>upsert('groups/'+g.id,{draft:{auto:{[ME.uid]:t.checked}}}),t.checked?'Autopick is on. Varsity will pick the best player for your open spots.':'Autopick is off');
  });
})();
</script>
</body></html>
